---
# Optional: put LeHarness (the local LLM serving harness for LeClanker,
# https://github.com/Clanker-Labs/LeHarness) on this machine. Like the apps
# role, this deliberately reimplements nothing — it clones the repo and calls
# its own scripts (detect / configure / up), so hardware detection and engine
# selection stay defined there.
- name: Skip leharness role when disabled
  ansible.builtin.meta: end_role
  when: leharness is not defined or not leharness.enabled | bool

- name: Resolve the LeHarness checkout path
  ansible.builtin.set_fact:
    leharness_repo_dir: "{{ leharness.destination | regex_replace('^~', setup_target_home) }}"

- name: Clone the LeHarness repository
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.git:
    repo: "{{ leharness.repo_url }}"
    dest: "{{ leharness_repo_dir }}"
    version: "{{ leharness.version | default('master') }}"
    # Bracket syntax: leharness.update would resolve to dict.update, the method.
    update: "{{ leharness['update'] | default(true) | bool }}"

- name: Verify LeHarness prerequisites (docker, GPU container runtime)
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.command:
    cmd: bash scripts/install.sh
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_install
  changed_when: false
  failed_when: false

# The one machine-level gap LeHarness can have that this repo should close:
# the NVIDIA container toolkit. install.sh --fix installs and wires it into
# docker; it is a no-op on machines without an NVIDIA GPU.
- name: Fix the GPU container runtime (nvidia-container-toolkit)
  ansible.builtin.command:
    cmd: bash scripts/install.sh --fix
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_fix
  changed_when: leharness_fix.rc == 0
  failed_when: false
  when:
    - leharness.install_gpu_runtime | default(true) | bool
    - leharness_install.rc != 0

- name: Re-check LeHarness prerequisites after fix
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.command:
    cmd: bash scripts/install.sh
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_install_final
  changed_when: false

- name: Fail when LeHarness prerequisites are still unmet
  ansible.builtin.fail:
    msg: >-
      LeHarness prerequisites failed after remediation:
      {{ leharness_install_final.stderr | default(leharness_install.stderr) | default('(no stderr)') }}
  when:
    - leharness_install_final is defined
    - leharness_install_final.rc is defined
    - leharness_install_final.rc != 0

- name: Detect the hardware tier
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.command:
    cmd: python3 scripts/detect_hardware.py
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_detect
  changed_when: false

- name: Report the detected profile
  ansible.builtin.debug:
    msg: "{{ leharness_detect.stdout | default('detection failed') }}"

# Optional non-interactive configure — passes through to `leharness configure`
# without reimplementing the wizard. Keys map 1:1 to CLI flags.
- name: Apply non-interactive LeHarness configure
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.command:
    cmd: >-
      python3 scripts/configure.py --non-interactive
      --engine {{ leharness.configure.engine }}
      --topology {{ leharness.configure.topology | default('single') }}
      {% if leharness.configure.preset is defined and leharness.configure.preset %}
      --preset {{ leharness.configure.preset }}
      {% endif %}
      --bind {{ leharness.configure.bind | default('127.0.0.1') }}
      {% if leharness.configure.cluster_addr is defined and leharness.configure.cluster_addr %}
      --cluster-addr {{ leharness.configure.cluster_addr }}
      {% endif %}
      {% if leharness.configure.head_address is defined and leharness.configure.head_address %}
      --head-address {{ leharness.configure.head_address }}
      {% endif %}
      {% if leharness.configure.cluster_nodes is defined %}
      --cluster-nodes {{ leharness.configure.cluster_nodes }}
      {% endif %}
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_configure
  changed_when: leharness_configure.rc == 0
  when:
    - leharness.configure is defined
    - leharness.configure.enabled | default(false) | bool

- name: Install templated leharness systemd unit
  ansible.builtin.template:
    src: leharness.service.j2
    dest: /etc/systemd/system/leharness.service
    mode: "0644"
  notify: Reload systemd
  when: leharness.systemd | default(true) | bool

- name: Install templated leharness dashboard systemd unit
  ansible.builtin.template:
    src: leharness-dashboard.service.j2
    dest: /etc/systemd/system/leharness-dashboard.service
    mode: "0644"
  notify: Reload systemd
  when: leharness.systemd | default(true) | bool

- name: Enable leharness systemd unit
  ansible.builtin.systemd:
    name: leharness
    enabled: true
    daemon_reload: true
  when:
    - leharness.systemd | default(true) | bool
    - leharness.start | default(false) | bool

- name: Enable leharness dashboard systemd unit
  ansible.builtin.systemd:
    name: leharness-dashboard
    enabled: true
    state: started
    daemon_reload: true
  when:
    - leharness.systemd | default(true) | bool
    - leharness.dashboard | default(true) | bool

# Serving is opt-in: it pulls multi-GB model weights and pins GPU memory,
# which a provisioning run should not silently commit the machine to.
- name: Start the LeHarness stack
  become: true
  become_user: "{{ setup_target_user }}"
  ansible.builtin.command:
    cmd: bash scripts/up.sh
    chdir: "{{ leharness_repo_dir }}"
  register: leharness_up
  changed_when: leharness_up.rc == 0
  when: leharness.start | default(false) | bool

- name: Explain what to do next
  ansible.builtin.debug:
    msg:
      - "LeHarness is at {{ leharness_repo_dir }}."
      - "Configure: {{ leharness_repo_dir }}/bin/leharness configure"
      - "Serve: make -C {{ leharness_repo_dir }} up    Health: make -C {{ leharness_repo_dir }} doctor"
      - "Dashboard: {{ leharness_repo_dir }}/bin/leharness dashboard  (token in {{ leharness_repo_dir }}/.state/admin.token)"
      - "Clients use the gateway bind from leharness.local.yaml (model 'chat')."
